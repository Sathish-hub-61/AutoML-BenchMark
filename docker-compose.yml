version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: acbs-db
    environment:
      POSTGRES_USER: acbs_user
      POSTGRES_PASSWORD: acbs_password
      POSTGRES_DB: acbs_benchmark
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acbs_user -d acbs_benchmark"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acbs-api
    command: uvicorn acbs.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://acbs_user:acbs_password@db:5432/acbs_benchmark
    depends_on:
      db:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acbs-ui
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    environment:
      - UI_API_BASE=http://api:8000
    depends_on:
      - api

volumes:
  pgdata:
