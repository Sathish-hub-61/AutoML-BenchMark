seed: 42
cv_folds: 5
test_size: 0.2
n_jobs: 1
metrics_primary: f1_macro
tuning: none
n_trials: 20
time_budget_seconds: 120
total_budget_seconds: 1800
imbalance_ratio_threshold: 3.0
high_cardinality: 15
id_unique_ratio: 0.95
max_upload_mb: 50
smote_max_rows: 20000
smote_min_minority: 6
feature_selection: none
k_best: 20
outlier_clipping: false
max_upload_rows: 250000
models:
  - logistic_regression
  - svm
  - decision_tree
  - random_forest
  - xgboost
  - gradient_boosting
  - naive_bayes
  - knn
weights:
  accuracy: 0.15
  f1: 0.25
  precision: 0.1
  recall: 0.15
  roc_auc: 0.15
  train_time: 0.1
  predict_time: 0.05
  interpretability: 0.05

automl_interpretability:
  stacked_ensemble: 1
  single_pipeline: 2
  autogluon: 1
  h2o: 1
  lightautoml: 1
  flaml: 2
  gama: 2
  mljar: 2
  naiveautoml: 2
  tpot: 2
  autosklearn: 2
  autosklearn2: 2

# Optional AI advisor: narrates the stored recommendation through the hosted
# Respan gateway (needs RESPAN_API_KEY in the server environment).
advisor:
  model: gpt-5.5
  max_tokens: 600

automl_value_thresholds:
  f1_worth_it_delta: 0.02
  max_training_time_ratio: 20.0

