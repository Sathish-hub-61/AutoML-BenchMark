[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acbs"
version = "0.1.0"
description = "Auto Classifier Benchmarking System"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "scikit-learn>=1.4",
  "pandas>=2.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "xgboost>=2.0",
  "imbalanced-learn>=0.12",
  "optuna>=3.6",
  "plotly>=5.22",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "streamlit>=1.49",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "openml>=0.14",
  "joblib>=1.4",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "requests>=2.32",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
]
pdf = ["xhtml2pdf>=0.2.16"]
postgres = ["psycopg2-binary>=2.9"]

[project.scripts]
acbs = "acbs.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acbs = ["reporting/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
